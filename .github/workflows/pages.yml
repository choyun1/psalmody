# The demo of the chant browser on GitHub Pages (https://choyun1.github.io/psalmody/): built from this
# repository alone, with the template parish (parish.example/, the fictional St. Example's), so nothing private
# is in it. It has no launcher, so it can't save; everything to look at works.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt lilypond
      - name: Build the chant browser for St. Example's
        run: |
          cp -r parish.example parish
          PSALTER_DEMO=1 python tools/browser.py
      - name: The page, its fonts, and a front door
        run: |
          mkdir -p _site/parish _site/style
          cp -r parish/site _site/parish/site
          cp -r style/fonts _site/style/fonts
          printf '<!doctype html><meta charset="utf-8"><title>Psalmody</title><meta http-equiv="refresh" content="0; url=parish/site/index.html"><a href="parish/site/index.html">The chant browser</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    # once Pages is turned on (Settings → Pages → Source: GitHub Actions); until then, the build alone, as a check
    if: github.event_name == 'workflow_dispatch' || github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
