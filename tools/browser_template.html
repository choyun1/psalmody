<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chant Browser</title>
<style>
@font-face { font-family: "EBG"; src: url("../style/fonts/EBGMedium-Regular.ttf"); }
@font-face { font-family: "EBG"; font-style: italic; src: url("../style/fonts/EBGMedium-Italic.ttf"); }
@font-face { font-family: "EBG"; font-weight: bold; src: url("../style/fonts/EBGSemiBold-Bold.ttf"); }
:root {
  --bg: #f7f4ee; --panel: #fffdf9; --ink: #2a2622; --muted: #7a7168; --line: #e3ddd2; --accent: #8a2b2b;
  --bright: #b7791f; --calm: #2f7d6d; --shadowed: #6b5b95; --dark: #7b2d26; --other: #6f6f6f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1b19; --panel: #262320; --ink: #ece6dc; --muted: #a39a8f; --line: #3a3530; --accent: #e08a7a;
    --bright: #e0a84a; --calm: #5fbfa9; --shadowed: #a796d6; --dark: #e07a6e; }
  .notation img { filter: invert(0.9) hue-rotate(180deg); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 "EBG", Georgia, serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; gap: 24px; padding: 12px 24px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 26px; font-weight: normal; letter-spacing: .02em; }
nav button { background: none; border: none; font: inherit; color: var(--muted); padding: 4px 2px; margin-right: 14px; cursor: pointer;
  border-bottom: 2px solid transparent; }
nav button.on { color: var(--ink); border-color: var(--accent); }
#savebar { margin-left: auto; font-size: 15px; color: var(--muted); }
#savebar button { margin-left: 8px; }
button.small, select, input[type=search], input[type=text], textarea {
  font: 15px "EBG", Georgia, serif; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
button.small { cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
main { padding: 18px 24px 60px; }
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 26px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } main, header { padding-left: 16px; padding-right: 16px; } }
aside { position: sticky; top: 74px; max-height: calc(100vh - 90px); overflow: auto; }
aside h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: normal; margin: 16px 0 6px; }
aside .row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 14px; padding: 1px 9px; border-radius: 99px; border: 1px solid currentColor;
  color: var(--c, var(--other)); background: transparent; cursor: default; white-space: nowrap; line-height: 1.5; }
button.chip { cursor: pointer; font-family: inherit; }
.chip.on { background: var(--c, var(--other)); color: var(--panel); }
.chip.off { opacity: .45; }
button.pin { padding: 2px 8px; }
.endings { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.ending { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.ending img { display: block; height: 46px; width: auto; max-width: 100%; margin: 4px 0; }
button.pin.on { color: var(--accent); border-color: var(--accent); }
.g-bright { --c: var(--bright); } .g-calm { --c: var(--calm); } .g-shadowed { --c: var(--shadowed); } .g-dark { --c: var(--dark); }
.count { color: var(--muted); font-size: 15px; margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }
.card.flash { outline: 2px solid var(--accent); }
.card h2 { font-size: 22px; font-weight: normal; margin: 0; display: inline; }
.card .who { color: var(--muted); margin-left: 8px; }
.facts { color: var(--muted); font-size: 15px; margin: 2px 0 6px; }
.facts b { color: var(--ink); font-weight: normal; }
.stars { color: var(--bright); letter-spacing: 1px; }
.notation { margin: 8px 0 4px; overflow-x: auto; }
.notation img { max-width: 100%; height: auto; max-height: 150px; display: block; }
.notes { font-style: italic; }
.used { font-size: 15px; color: var(--muted); }
.moodrow { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.play { float: right; }
.edit { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
.edit textarea { width: 100%; min-height: 40px; }
.edit .moodpick { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.list li:hover { background: var(--panel); }
.list li.on { background: var(--panel); outline: 1px solid var(--line); }
.list .dots { display: flex; gap: 3px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.latin { font-style: italic; color: var(--muted); margin-left: 10px; }
.section { border-left: 3px solid var(--line); padding: 2px 0 2px 14px; margin: 14px 0; }
.sugg { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 6px; }
.sugg td, .sugg th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.sugg th { font-weight: normal; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
a, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
.hint { color: var(--muted); font-size: 15px; font-style: italic; }
table.hist { border-collapse: collapse; width: 100%; font-size: 15px; }
table.hist td, table.hist th { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
code { font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.ptext { font-size: 16px; line-height: 1.55; margin: 8px 0 4px; }
.ptext .v { margin: 0 0 7px; }
.seqrow { display: grid; grid-template-columns: 9.5em 1fr auto; gap: 4px 10px; align-items: start; margin: 6px 0; }
.seqrow select { width: 100%; }
.seqbtn { white-space: nowrap; padding-top: 5px; }
@media (max-width: 640px) { .seqrow { grid-template-columns: 1fr auto; } .seqrow select { grid-column: 1 / -1; } }
.seg { display: flex; gap: 0; margin-bottom: 4px; }
.seg button { flex: 1; font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
.seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.ptext .vclick { cursor: pointer; border-radius: 4px; }
.ptext .vclick:hover { background: var(--line); color: var(--accent); }
.ptext .vn { display: inline-block; width: 2.2em; text-align: right; margin-right: .6em; color: var(--muted); font-size: 13px; }
.ptext .l2 { padding-left: 4.2em; }
.ptext .l1 { padding-left: 2.8em; }
.ptext .wrap { padding-left: 6em; }
.pbar { display: inline-block; width: 1px; height: .62em; background: currentColor; margin: 0 2px; vertical-align: .38em; }
.held { text-decoration: underline dotted; text-underline-offset: 3px; }
.sc { font-variant: small-caps; }
.pv-music { margin: 12px 0 4px; }
.svrow { display: grid; grid-template-columns: 9.5em 1fr; gap: 4px 10px; align-items: start; margin: 5px 0; }
.svrow > label { padding-top: 5px; color: var(--muted, #666); }
.svhint { font-size: 14px; margin: 2px 0 0; min-height: 0; }
.warn { color: #a33; }
a.small { font-size: 14px; margin-left: 6px; }
@media (max-width: 640px) { .svrow { grid-template-columns: 1fr; } }
.pv-music img { max-width: 100%; max-height: 120px; }
.pv-credit { text-align: right; font-style: italic; color: var(--muted); font-size: 14px; }
details > summary { cursor: pointer; color: var(--accent); }
.pick { display: grid; grid-template-columns: 210px 1fr; gap: 16px; }
@media (max-width: 760px) { .pick { grid-template-columns: 1fr; } }
.pick .item { border-bottom: 1px solid var(--line); padding: 8px 0; }
.pick .item img { max-width: 100%; max-height: 90px; display: block; margin: 4px 0; }
#dlg.wide { max-width: min(1100px, 96vw); }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); max-width: min(900px, 94vw); width: 100%; padding: 8px 16px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
</style>
</head>
<body>
<header>
  <h1>Chant Browser</h1>
  <nav>
    <button data-tab="upcoming" class="on">Coming up</button>
    <button data-tab="builder">Service planner</button>
    <button data-tab="chants">Chants</button>
    <button data-tab="texts">Psalms</button>
    <button data-tab="history">History</button>
  </nav>
  <span id="savebar"></span><span id="gitbar"></span>
</header>
<main>
  <section id="tab-upcoming"></section>
  <section id="tab-builder" hidden></section>
  <section id="tab-chants" hidden></section>
  <section id="tab-texts" hidden></section>
  <section id="tab-history" hidden></section>
</main>
<dialog id="dlg"><div id="dlgbody"></div><p><button class="small" onclick="dlg.close()">Close</button></p></dialog>
<script src="data.js"></script>
<script>
"use strict";
const D = window.PSALTER;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// ---------- vocabulary ----------
const GROUP = {}; const ORDER = [];
D.vocabulary.forEach(g => g.tags.forEach(t => { GROUP[t] = g.group; ORDER.push(t); }));
const gclass = t => GROUP[t] ? "g-" + GROUP[t] : "";
const chip = (t, extra = "") => `<span class="chip ${gclass(t)} ${extra}">${esc(t)}</span>`;

// ---------- local edits (kept in this browser until exported) ----------
const KEY = "psalter-edits-v1";
let edits = {};
try { edits = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { edits = {}; }
function saveEdits() { try { localStorage.setItem(KEY, JSON.stringify(edits)); } catch (e) {} renderSavebar(); }
const C = {}; D.chants.forEach(c => C[c.id] = c);
Object.keys(edits).forEach(id => {
  if (!C[id]) { delete edits[id]; return; }
  Object.keys(edits[id]).forEach(f => { if (JSON.stringify(C[id][f]) === JSON.stringify(edits[id][f])) delete edits[id][f]; });
  if (!Object.keys(edits[id]).length) delete edits[id];
});
try { localStorage.setItem(KEY, JSON.stringify(edits)); } catch (e) {}
function val(c, f) { return edits[c.id] && f in edits[c.id] ? edits[c.id][f] : c[f]; }
function setEdit(id, f, v) {
  edits[id] = edits[id] || {};
  const orig = C[id][f];
  if (JSON.stringify(orig) === JSON.stringify(v)) delete edits[id][f]; else edits[id][f] = v;
  if (!Object.keys(edits[id]).length) delete edits[id];
  saveEdits();
}
let savedNote = "";
function renderSavebar() {
  const n = Object.keys(edits).length;
  const canWrite = SERVER || "showSaveFilePicker" in window;
  $("#savebar").innerHTML = (savedNote ? `<span>${esc(savedNote)}</span> ` : "") + (n ? `${n} chant${n > 1 ? "s" : ""} edited here
    <button class="small primary" onclick="saveCatalog()">${canWrite ? "Save" : "Download chant_notes.csv"}</button>
    <button class="small" onclick="discardEdits()">Discard</button>` : "");
}
function discardEdits() { if (window.confirm("Discard the edits made in this browser?")) { edits = {}; savedNote = ""; saveEdits(); renderChants(); } }
function csvField(v) { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function catalogText() {
  const cols = ["Chant", "Rating", "Mood", "Notes", "Pin"];
  const lines = [cols.join(",")];
  D.chants.forEach(c => {
    const r = val(c, "rating");
    lines.push([c.id, r == null ? "" : r, val(c, "mood").join("; "), val(c, "notes"), (val(c, "pins") || []).join("; ")].map(csvField).join(","));
  });
  return lines.join("\n") + "\n";
}
// remember the catalog file between visits (Chrome and Edge only)
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("psalter", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction("kv", mode); const q = fn(tx.objectStore("kv")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };
  });
}
let SERVER = false;
if (location.protocol.startsWith("http")) fetch("/api/ping").then(r => r.ok && r.json()).then(j => { if (j && j.ok) { SERVER = true; renderSavebar(); renderHistory(); refreshGit(); if (!$("#tab-builder").hidden) renderBuilder(); } }).catch(() => {});
async function refreshGit() {
  if (!SERVER) return;
  try {
    const j = await (await fetch("/api/git")).json();
    const n = j.repos.reduce((a, r) => a + r.changes, 0);
    $("#gitbar").innerHTML = n ? ` <button class="small" title="${esc(j.repos.flatMap(r => r.files.map(f => r.name + ": " + f)).join("\n"))}" onclick="commitAll()">Save ${n} change${n > 1 ? "s" : ""} to GitHub</button>` : "";
  } catch (e) {}
}
async function commitAll() {
  const msg = window.prompt("A few words describing the changes (for the GitHub history):", "Updates from the chant browser");
  if (msg === null) return;
  $("#gitbar").textContent = " Saving to GitHub…";
  const j = await post("/api/commit", {message: msg});
  window.alert(j.log || (j.ok ? "Saved." : "Something went wrong."));
  refreshGit();
}
setInterval(refreshGit, 30000);
async function post(url, obj) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(obj)});
  setTimeout(refreshGit, 800);
  return r.json();
}
async function saveCatalog() {
  const text = catalogText();
  if (SERVER) {
    savedNote = "Saving…"; renderSavebar();
    const j = await post("/api/notes", {csv: text});
    savedNote = !j.ok ? "Could not save: " + (j.error || j.log)
      : j.rebuilt === false ? "Saved to chant_notes.csv, but the page couldn't be refreshed: " + (j.log || "").trim().split("\n").pop()
      : "Saved.";
    if (j.ok) {                                   // what was saved is now the chant's own value: nothing left pending
      Object.entries(edits).forEach(([id, e]) => { if (C[id]) Object.assign(C[id], e); });
      edits = {}; saveEdits();
    }
    renderSavebar(); return;
  }
  if (!("showSaveFilePicker" in window)) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"})); a.download = "chant_notes.csv"; a.click();
    savedNote = "Downloaded: save it over parish/chant_notes.csv.";
    renderSavebar(); return;
  }
  try {
    let h = null;
    try { h = await idb("readonly", st => st.get("notes")); } catch (e) {}
    if (h && (await h.requestPermission({mode: "readwrite"})) !== "granted") h = null;
    if (!h) {
      window.alert("Choose parish/chant_notes.csv in your psalter folder. The browser will remember it next time.");
      h = await window.showSaveFilePicker({suggestedName: "chant_notes.csv", types: [{description: "CSV", accept: {"text/csv": [".csv"]}}]});
      try { await idb("readwrite", st => st.put(h, "notes")); } catch (e) {}
    }
    const w = await h.createWritable(); await w.write(text); await w.close();
    savedNote = "Saved to " + h.name + ". Run tools/browser.py to refresh, then commit.";
    renderSavebar();
  } catch (e) {
    if (e && e.name !== "AbortError") window.alert("Could not save: " + e.message);
  }
}

// ---------- history ----------
const usedBy = {}, textHist = {};
D.history.forEach(h => {
  if (h.chant && h.chant !== "?") (usedBy[h.chant] = usedBy[h.chant] || []).push(h);
  (textHist[h.text] = textHist[h.text] || []).push(h);
});
const textTitle = {}; D.texts.forEach(t => textTitle[t.id] = t.title);
const lastUsed = id => (usedBy[id] || []).map(h => h.date).sort().pop() || "";

// ---------- playback ----------
let audio = null, playing = null, playId = 0;     // playId: which playback is current, so an old one's timer can't stop a new one
function stopPlay() { playId++; if (playing) { playing.forEach(o => { try { o.stop(); } catch (e) {} }); playing = null; } document.querySelectorAll(".play").forEach(b => b.textContent = "▶ Play"); }
function play(id, btn) { playVoices(C[id].voices, btn); }
function playTone(name, btn) { playVoices((D.tones || []).find(t => t.name === name).voices, btn); }
function playVoices(voices, btn) {
  if (playing) { const was = btn.textContent.startsWith("■"); stopPlay(); if (was) return; }
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const c = {voices}, wn = 2.09;                // seconds per whole note (raise to slow down)
  const t0 = audio.currentTime + 0.08, out = audio.createGain(); out.gain.value = 0.11; out.connect(audio.destination);
  const lp = audio.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400; lp.connect(out);
  playing = []; let end = 0;
  Object.entries(c.voices).forEach(([v, evs]) => {
    if (v === "descant") return;
    evs.forEach(([m, st, du]) => {
      const f = 440 * Math.pow(2, (m - 57) / 12), a = t0 + st * wn, b = a + du * wn;
      end = Math.max(end, b);
      const g = audio.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(1, a + 0.04);
      g.gain.setValueAtTime(1, b - 0.06); g.gain.linearRampToValueAtTime(0, b); g.connect(lp);
      [[1, 1], [2, .45], [3, .18], [4, .12]].forEach(([h, amp]) => {
        const o = audio.createOscillator(), og = audio.createGain(); o.frequency.value = f * h; og.gain.value = amp;
        o.connect(og); og.connect(g); o.start(a); o.stop(b + 0.02); playing.push(o);
      });
    });
  });
  btn.textContent = "■ Stop";
  const me = ++playId;
  setTimeout(() => { if (me === playId) stopPlay(); }, (end - audio.currentTime + 0.2) * 1000);
}

// ---------- chant card ----------
function stars(r) { return r == null ? "" : `<span class="stars" title="your rating">${"★".repeat(r)}${"☆".repeat(Math.max(0, 5 - r))}</span>`; }
function chantCard(c, opts = {}) {
  const mood = val(c, "mood"), uses = usedBy[c.id] || [];
  const last = uses.length ? uses.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0] : null;
  const usedTxt = uses.length ? `Used ${uses.length}× · last ${last.date} (${esc(textTitle[last.text] || last.text)}${last.verses ? " " + last.verses : ""})` : "Not used yet";
  const editing = opts.editing;
  return `<div class="card" id="card-${esc(c.id)}">
    <button class="small play" onclick="play('${esc(c.id)}', this)">▶ Play</button>${pinButtons(c)}
    <h2>${esc(c.id)}</h2><span class="who">${esc(c.composer)}${c.years ? " (" + esc(c.years) + ")" : ""}</span>
    <div class="facts"><b>${esc(keyName(c))}</b> · ${c.double ? "double" : "single"}
      ${c.range ? " · soprano " + esc(c.range.join("–")) : ""} ${c.acp ? " · ACP sets it to Ps " + esc(c.acp) : ""} ${stars(val(c, "rating"))}</div>
    <div class="moodrow">${mood.length ? mood.map(t => chip(t)).join("") : '<span class="hint">no mood tags yet</span>'}</div>
    ${c.img ? `<div class="notation"><img loading="lazy" src="notation/${encodeURIComponent(c.id)}.png" alt="${esc(c.id)}"></div>` : ""}
    ${val(c, "notes") ? `<div class="notes">${esc(val(c, "notes"))}</div>` : ""}
    <div class="used">${usedTxt} ${uses.length > 1 ? `<span class="link" onclick="showUses('${esc(c.id)}')">all</span>` : ""}</div>
    ${editing ? editBox(c) : `<p style="margin:6px 0 0"><span class="link" onclick="openEdit('${esc(c.id)}')">Edit mood, rating, notes</span>
      · <span class="link" onclick="dlg.close(); useInBuilder('${esc(c.id)}')">Use in the psalm builder</span></p>`}
  </div>`;
}
function editBox(c) {
  const mood = val(c, "mood"), r = val(c, "rating");
  return `<div class="edit">
    ${D.vocabulary.map(g => `<div class="moodpick">${g.tags.map(t => `<button class="chip g-${esc(g.group)} ${mood.includes(t) ? "on" : ""}" onclick="toggleMood('${esc(c.id)}','${esc(t)}')">${esc(t)}</button>`).join("")}</div>`).join("")}
    Rating: <select onchange="setEdit('${esc(c.id)}','rating', this.value === '' ? null : +this.value); refreshCard('${esc(c.id)}')">
      <option value="">–</option>${[1, 2, 3, 4, 5].map(n => `<option ${r === n ? "selected" : ""}>${n}</option>`).join("")}</select>
    <textarea placeholder="Notes on its character" onchange="setEdit('${esc(c.id)}','notes', this.value)">${esc(val(c, "notes"))}</textarea>
    <span class="link" onclick="closeEdit('${esc(c.id)}')">Done</span>
  </div>`;
}
const openEdits = new Set();
function openEdit(id) { openEdits.add(id); refreshCard(id); }
function closeEdit(id) { openEdits.delete(id); refreshCard(id); }
function toggleMood(id, t) {
  const m = val(C[id], "mood").slice(), i = m.indexOf(t);
  if (i >= 0) m.splice(i, 1); else m.push(t);
  setEdit(id, "mood", m); refreshCard(id);
}
function refreshCard(id) {
  document.querySelectorAll("#card-" + CSS.escape(id)).forEach(el => {
    el.outerHTML = chantCard(C[id], {editing: openEdits.has(id)});
  });
}
function showUses(id) {
  const rows = (usedBy[id] || []).slice().sort((a, b) => a.date < b.date ? 1 : -1);
  $("#dlgbody").innerHTML = `<h2 style="font-weight:normal">${esc(id)}: every use</h2><table class="hist">${rows.map(h =>

const PC = {C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, Fb: 4, F: 5, "E#": 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11, Cb: 11};

function score(textTags, chantTags) {
  if (!textTags.length || !chantTags.length) return {s: 0, hits: []};
  let s = 0; const hits = [];
  textTags.forEach((t, i) => {
    const w = i === 0 ? 1.0 : 0.75;            // the first tag is the main character
    if (chantTags.includes(t)) { s += w; hits.push(t); }
    else if (chantTags.some(c => GROUP[c] && GROUP[c] === GROUP[t])) s += 0.4 * w;
  });
  return {s: s / textTags.length, hits};
}

  return D.chants.map(c => ({c, ...score(sec.mood, val(c, "mood"))}))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || (val(b.c, "rating") || 0) - (val(a.c, "rating") || 0) || lastUsed(a.c.id).localeCompare(lastUsed(b.c.id)))
    .slice(0, 10);
}

// pointed text as HTML
function pointedLine(t) {
  // mark the pointing with placeholders first, then escape, then turn placeholders into markup
  t = t.replace(/(\S+)- \| -(\S+)/g, "$1\u0001$2").replace(/(\S+)- \| (\S+)/g, "$1-\u0001$2")
       .replace(/(\S+)- \. -(\S+)/g, "$1\u0004$2")
       .replace(/(^|\s)\|\s/g, "$1\u0001").replace(/\s\.\s/g, " \u0004 ")
       .replace(/=([^\s\u0001]+)/g, "\u0002$1\u0003");
  let h = esc(t).replace(/&quot;/g, '"');
  h = h.replace(/(^|[\s\u0001\u0002])"(?=\S)/g, "$1“").replace(/"/g, "”").replace(/(^|[\s\u0001\u0002])'(?=\w)/g, "$1‘").replace(/'/g, "’");
  h = h.replace(/\bLORD/g, 'L<span class="sc">ord</span>').replace(/\bGOD\b/g, 'G<span class="sc">od</span>');
  return h.replace(/\u0001/g, '<span class="pbar"></span>').replace(/\u0004/g, "·")
          .replace(/\u0002/g, '<span class="held">').replace(/\u0003/g, "</span>");
}
function pointedHTML(body, verses, pi) {
  // pi given: the verse numbers can be clicked to put a † on the verse or take it off (this Sunday only)
  const vn = (n, dag) => pi === undefined || n === "" ? `<span class="vn">${dag ? "† " : ""}${esc(n)}</span>`
    : `<span class="vn vclick" title="click: † on this verse or off (this file only)" onclick="toggleDagger(${pi}, ${n})">${dag ? "† " : ""}${esc(n)}</span>`;
  return '<div class="ptext">' + body.filter(v => !verses || verses.includes(v[0]) || v[0] === "").map(([n, dag, lines]) =>
    `<div class="v">${lines.map((l, i) => `<div class="${i === 0 ? "" : l[2] ? "wrap" : l[1] === 2 ? "l2" : "l1"}">${i === 0 ? vn(n, dag) : ""}${pointedLine(l[0])}</div>`).join("")}</div>`).join("") + "</div>";
}
// second-half repeats (†): the text's own, or this Sunday's
function textDaggers(res) { return textBody(res).flatMap(seg => seg.body.filter(v => v[1]).map(v => v[0])); }

  cur.has(n) ? cur.delete(n) : cur.add(n);

  p.open = true; renderBuilder();
}
function fitReport(p, pi) {

  const res = resolveSpec(p.spec, optOf(p)); if (!res.length) return "";
  const verses = textBody(res).flatMap(seg => withDaggers(seg.body, p.daggers)).filter(v => v[0] !== "");
  let chants = p.chants.filter(c => c.name).map((c, i) => ({name: c.name, from: i === 0 ? verses[0][0] : +c.from}));
  if (!chants.length) { const prev = B.psalms.slice(0, pi).reverse().map(q => q.chants.filter(c => c.name).pop()).find(Boolean); if (prev) chants = [{name: prev.name, from: verses[0][0]}]; }
  const out = [];
  chants.forEach((c, i) => {
    const to = i + 1 < chants.length ? chants[i + 1].from : 1e9, ch = C[c.name];
    const vs = verses.filter(v => v[0] >= c.from && v[0] < to);
    if (!ch || !vs.length) return;
    if (!ch.double) { if (vs.some(v => v[1])) out.push(`<span class="warn">⚠ † in a single chant (${esc(c.name)}): sung as ordinary verses</span>`); return; }
    let half = 1; const probs = [];
    vs.forEach(v => { if (v[1]) { if (half !== 1) probs.push(`† at v. ${v[0]} falls on the second half`); return; } half = half === 1 ? 2 : 1; });
    if (half !== 1) probs.push("ends in the middle of the chant: put a † on one verse (click its number in the text)");
    out.push(probs.length ? `<span class="warn">⚠ ${esc(c.name)}: ${probs.join("; ")}</span>` : `<span class="hint">✓ the verses fit ${esc(c.name)} (double)</span>`);
  });
  return out.join("<br>");
}

function quickPreview() {
  const out = [];

  const gl = B.gloria === "yes" || (B.gloria === "auto" && /office|evensong|morning prayer|evening prayer/i.test(B.service));
  B.psalms.forEach((p, pi) => {

    const chants = p.chants.filter(c => c.name).map((c, i) => ({name: c.name, from: i === 0 ? null : +c.from || null}));
    if (!chants.length && lastMusic) chants.push({name: lastMusic, from: null});
    textBody(res).map(seg => ({...seg, body: withDaggers(seg.body, p.daggers)})).forEach((seg, si) => {
      seg.body.forEach((v, vi) => {
        const starts = chants.filter((c, i) => (i === 0 && pi >= 0 && si === 0 && vi === 0) || (c.from === v[0]));
        starts.forEach(c => { out.push(musicHTML(c.name)); lastMusic = c.name; });

  const lastText = (() => { const p = [...B.psalms].reverse().find(p => resolveSpec(p.spec, optOf(p)).length); const r = p ? resolveSpec(p.spec, optOf(p)) : []; return r.length ? TX[r[r.length - 1].id] : null; })();

  return `<div class="card"><h3 style="font-weight:normal;margin:0 0 4px">The service <span class="hint">· ${esc(order)}, in the order it happens</span></h3>
    <p class="hint" style="margin:0 0 8px">Add lessons, hymns and pieces in any order; ↑ ↓ move them. Lessons are numbered for you (The First Lesson…).${prev ? ` <span class="link" onclick="copySeq('${prev}')">Start from ${esc(prev)}'s order</span>` : ""}</p>
    <div class="svrow"><label>Organist</label><div><input type="text" value="${esc(B.svc.organist || "")}" onchange="setSvc('organist', this.value)" style="width:120px"></div></div>
    ${rows || '<p class="hint">Nothing yet.</p>'}
    <p style="margin:8px 0" class="hint">add: ${adds.map(x => `<span class="link" onclick="B.seq.push(['${x.key}','']); renderBuilder()">${esc(x.label.replace(/\s*\{hymn\|anthem\}/, ""))}</span>`).join(" · ")} · <span class="link" onclick="B.seq.push(['also','']); renderBuilder()">other</span></p>
    <div class="svrow"><label>Note</label><div><textarea rows="2" style="width:100%" onchange="B.note=this.value; refreshFile()">${esc(B.note)}</textarea></div></div>
    ${PLUGINS.rows.map(f => f()).join("")}
    <datalist id="rep-lesson">${(SV.lessons || []).map(l => `<option value="${esc(l.reading)}">${esc(l.summary)}</option>`).join("")}</datalist>
  </div>`;
}
function seqMove(i, d) { const j = i + d; if (j < 0 || j >= B.seq.length) return; [B.seq[i], B.seq[j]] = [B.seq[j], B.seq[i]]; renderBuilder(); }
function copySeq(d) {
  if (B.seq.length && !confirm("Replace this list with " + d + "'s?")) return;
  B.seq = SV.byDate[d].items.filter(([k]) => !["organist", "note"].includes(k) && !PLUGIN_KEYS.has(k)).map(([k, v]) => [k, v]); renderBuilder();
}
const ORD = ["First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth", "Ninth", "Tenth", "Eleventh", "Twelfth"];
function lessonKey(ref) { const m = String(ref).replace(/–/g, "-").match(/^\s*((?:\d\s*)?[A-Za-z]+)\s*(\d+)\s*:\s*(\d+)/); return m ? `${m[1].toLowerCase().replace(/ /g, "")} ${m[2]}:${m[3]}` : String(ref).trim().toLowerCase(); }
function lessonHint(v, n) {
  if (!(v || "").trim()) return "";
  let [ref, summary] = v.split("|").map(x => x.trim());
  if (!summary) { const hit = (SV.lessons || []).find(l => lessonKey(l.reading) === lessonKey(ref)); summary = hit ? hit.summary : ""; }
  return `<span class="hint">The ${ORD[n - 1] || n + "th"} Lesson: ${esc(ref)}${summary ? " (" + esc(summary) + ")" : ' · <span class="warn">no summary yet: add one after a |</span>'}</span>`;
}
function seqAnthemBox(i) {
  const v = (B.seq[i][1] || "").trim(); if (!v || hymnsOf(v).length) return "";
  const a = findAnthem(v);
  const [t] = splitPiece(v), id = "seq" + i;
  return `<details style="margin:4px 0 8px"><summary class="hint">${a ? "Words" + (a.source ? " (" + esc(a.source) + ")" : "") + ": on file" : "No words on file yet: paste them here"}</summary>
    <input type="text" id="asrc-${id}" value="${esc(a ? a.source : "")}" placeholder="Where the words come from (optional)" style="width:100%;margin:6px 0">
    <textarea id="atxt-${id}" style="width:100%;height:${a ? Math.min(24, a.text.split("\n").length + 1) * 1.45 : 8}em;font-family:inherit;font-size:15px;line-height:1.45">${esc(a ? a.text : "")}</textarea>
    ${SERVER ? `<button class="small" onclick="saveSeqAnthem(${i})">Save the words</button>` : ""}</details>`;
}
async function saveSeqAnthem(i) {
  const [title, composer] = splitPiece(B.seq[i][1]), id = "seq" + i;
  const source = $("#asrc-" + id).value.trim(), text = $("#atxt-" + id).value;
  const j = await post("/api/anthem", {title, composer, source, text});
  if (!j.ok) { alert(j.error || "could not save"); return; }
  const a = findAnthem(B.seq[i][1]);
  if (a) Object.assign(a, {source, text}); else SV.anthems.push({title, composer, source, text});
  renderBuilder();
}
function serviceCard() {
  if (!ORDER_NAMES.length) return "";
  if (isSeq()) return seqCard();
  const order = curOrder(), sl = slotsOf(order), prev = previousService(B.date, order);
  const shown = sl.filter(s => !s.optional || B.svc[s.key] || B.showOpt.has(s.key));
  const hidden = sl.filter(s => !shown.includes(s));
  const others = Object.keys(B.svc).filter(k => k !== "organist" && !sl.some(s => s.key === k) && (B.svc[k] || "").trim());
  const row = s => {
    const list = s.kind === "hymn" || s.kind === "service" ? "" : "rep-" + sid(family(s));
    const ph = {hymn: "hymn number(s), e.g. 390 or LEVAS 114", anthem: "hymn number, or Title - Composer (dates)", music: "Title - Composer (dates)", service: "e.g. S278"}[s.kind];
    return `<div class="svrow"><label>${esc(s.label.replace("{hymn|anthem}", "hymn or anthem"))}</label>
      <div><input type="text" value="${esc(B.svc[s.key] || "")}" ${list ? `list="${list}"` : ""} placeholder="${ph}" onchange="setSvc('${s.key}', this.value)" style="width:100%">
      <div id="sh-${sid(s.key)}" class="svhint">${slotHint(s)}</div>
      <div id="ab-${sid(s.key)}">${s.kind === "anthem" ? anthemBox(s.key) : ""}${s.words ? wordsHint(s) : ""}</div></div></div>`;
  };
  return `${beforeCard()}<div class="card"><h3 style="font-weight:normal;margin:0 0 4px">The rest of the service <span class="hint">· order of service: ${esc(order)}</span></h3>
    <p class="hint" style="margin:0 0 8px">${SV.byDate[B.date] ? "Already planned for this date (the imported record or this Sunday's file). " : ""}${sl.some(s => s.kind === "service") ? `Service music carries on from the last ${esc(order)}${prev.date ? " (" + esc(prev.date) + ")" : ""} unless you change it. ` : ""}The order of service comes from the Service box (or the day), and is set out in services.txt.</p>
    <div class="svrow"><label>Organist</label><div><input type="text" value="${esc(B.svc.organist || "")}" onchange="setSvc('organist', this.value)" style="width:120px"></div></div>
    ${shown.map(row).join("")}
    ${others.map(k => row({key: k, label: k + " (not in this order)", kind: (anySlot(k) || {}).kind || "music"})).join("")}
    ${hidden.length ? `<div class="svrow"><label></label><div class="hint">add: ${hidden.map(s => `<span class="link" onclick="B.showOpt.add('${s.key}'); renderBuilder()">${esc(s.label.replace(/\s*\{hymn\|anthem\}/, ""))}</span>`).join(" · ")}</div></div>` : ""}
    <div class="svrow"><label>Other items</label><div><textarea rows="2" style="width:100%" placeholder="One per line, as written, e.g. Te Deum: Collegium Regale - Herbert Howells (1892-1983)" onchange="B.also=this.value; refreshFile()">${esc(B.also)}</textarea></div></div>
    <div class="svrow"><label>Note</label><div><textarea rows="2" style="width:100%" placeholder="Anything else worth writing down about this service" onchange="B.note=this.value; refreshFile()">${esc(B.note)}</textarea></div></div>
    ${PLUGINS.rows.map(f => f()).join("")}
  </div>`;
}
function repLists() { return Object.entries(REP).map(([f, list]) => `<datalist id="rep-${sid(f)}">${list.map(r => `<option value="${esc(r[0])}">${r[1].length}× · last ${esc(r[1][r[1].length - 1])}</option>`).join("")}</datalist>`).join(""); }
function setSvc(k, v) {
  B.svc[k] = v.trim(); refreshSlot(k);
  // the Nunc dimittis usually follows the Magnificat's setting
  const m = B.svc[k].match(/^Magnificat\b(.*)$/i);
  if (k === "magnificat" && m && !(B.svc["nunc dimittis"] || "").trim() && slotsOf(curOrder()).some(x => x.key === "nunc dimittis")) {
    B.svc["nunc dimittis"] = "Nunc dimittis" + m[1]; renderBuilder();
  }
}
function refreshSlot(k) {
  const s = anySlot(k);
  if (s) { const h = $("#sh-" + sid(k)); if (h) h.innerHTML = slotHint(s); const ab = $("#ab-" + sid(k)); if (ab && s.kind === "anthem") ab.innerHTML = anthemBox(k); }
  refreshFile();
}
function refreshFile() { const pre = $("#bfile"); if (pre) pre.textContent = sundayText(); PLUGINS.changed.forEach(f => f()); }

// ---------- tabs ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["upcoming", "builder", "chants", "texts", "history"].forEach(t => $("#tab-" + t).hidden = t !== b.dataset.tab);
  stopPlay();
  if (b.dataset.tab === "texts") renderTextsShell();
  if (b.dataset.tab === "upcoming") renderUpcoming();
  if (b.dataset.tab === "builder") renderBuilder();
});
const dlg = $("#dlg");
dlg.addEventListener("close", () => { dlg.classList.remove("wide"); stopPlay(); if (!$("#tab-chants").hidden) renderChants(); else if (!$("#tab-texts").hidden) renderText(); });
renderSavebar(); renderUpcoming(); renderChantsShell(); renderChants(); renderHistory();
</script>
<script>/*PLUGINS*/</script>
</body>
