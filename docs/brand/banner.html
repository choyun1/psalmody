<!doctype html>
<!-- The README banner (banner.html?banner, 1280×320), GitHub's social preview (?social, 1280×640) and the icon (?icon),
     light or dark as the system is. make.mjs takes the pictures. The chant is Turle in D minor (public domain),
     drawn by LilyPond; the verse is Psalm 23:1 of the 1979 BCP. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: EBG; src: url(../../style/fonts/EBGMedium-Regular.ttf); }
@font-face { font-family: EBG; font-style: italic; src: url(../../style/fonts/EBGMedium-Italic.ttf); }
:root { --bg: #f7f4ee; --panel: #fffdf9; --ink: #2a2622; --muted: #7a7168; --line: #e3ddd2; --accent: #8a2b2b; --inv: 0; }
@media (prefers-color-scheme: dark) { :root { --bg: #1d1b19; --panel: #262320; --ink: #ece6dc; --muted: #a39a8f; --line: #3a3530; --accent: #e08a7a; --inv: 1; } }
html, body { margin: 0; height: 100%; background: var(--panel); color: var(--ink); font-family: EBG, Georgia, serif; overflow: hidden; }
.wrap { height: 100%; display: flex; align-items: center; gap: 56px; padding: 0 64px; box-sizing: border-box; }
.id { display: flex; align-items: center; gap: 26px; flex: none; }
.id svg { width: 112px; height: 112px; }
h1 { font-weight: normal; font-size: 64px; margin: 0; line-height: 1; letter-spacing: .005em; }
.tag { font-style: italic; color: var(--muted); font-size: 21px; margin-top: 10px; line-height: 1.3; }
.rule { width: 1px; align-self: stretch; margin: 54px 0; background: var(--line); flex: none; }
.music { flex: 1; min-width: 0; }
.music img { width: 100%; display: block; filter: invert(var(--inv)) hue-rotate(calc(var(--inv) * 180deg)); mix-blend-mode: var(--blend, multiply); }
@media (prefers-color-scheme: dark) { .music img { --blend: screen; } }
.verse { font-size: 25px; margin-top: 14px; line-height: 1.45; }
.verse .n { color: var(--accent); font-size: 17px; margin-right: 6px; }
.verse .p { color: var(--accent); margin: 0 .12em; }
.verse .l2 { padding-left: 1.9em; }
.sc { font-variant: small-caps; letter-spacing: .03em; }
/* the social preview: stacked */
body.social .wrap { flex-direction: column; justify-content: center; gap: 34px; padding: 0 90px; }
body.social .rule { display: none; }
body.social .music { flex: none; width: 100%; }
body.social h1 { font-size: 82px; } body.social .tag { font-size: 25px; } body.social .verse { font-size: 31px; } body.social .verse .n { font-size: 21px; } body.social .id svg { width: 140px; height: 140px; }
body.icon .wrap { padding: 0; justify-content: center; } body.icon .id svg { width: 256px; height: 256px; } body.icon .music, body.icon .rule, body.icon h1, body.icon .tag { display: none; }
body.icon { background: transparent; } body.icon html { background: transparent; }
</style></head><body>
<div class="wrap">
  <div class="id">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
      <text x="15" y="38" font-family="EBG" font-size="21" fill="var(--accent)">1</text>
      <g stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round">
        <line x1="31" x2="82" y1="31" y2="31"/><line x1="38" x2="80" y1="48" y2="48"/><line x1="31" x2="78" y1="65" y2="65"/><line x1="38" x2="66" y1="82" y2="82"/></g>
      <g stroke="var(--accent)" stroke-width="4" stroke-linecap="round">
        <line x1="53" x2="53" y1="21" y2="35"/><line x1="65" x2="65" y1="38" y2="52"/><line x1="57" x2="57" y1="55" y2="69"/></g>
    </svg>
    <div><h1>Psalmody</h1><div class="tag">The psalms of the 1979 Prayer Book,<br>set to Anglican chant and plainsong</div></div>
  </div>
  <div class="rule"></div>
  <div class="music">
    <img src="turle.png" alt="">
    <div class="verse"><span class="n">1</span>The <span class="p">|</span> <span class="sc">Lord</span> is my <span class="p">|</span> shepherd; <span class="p">*</span><br>
      <span class="l2">I <span class="p">|</span> shall not <span class="p">|</span> be in <span class="p">|</span> want.</span></div>
  </div>
</div>
<script>document.body.className = location.search.slice(1) || "banner";</script>
</body></html>
