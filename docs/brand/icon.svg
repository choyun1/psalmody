<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Psalmody: a verse of a pointed psalter, its number and its pointing strokes. Follows light and dark. -->
  <style>
    .bg { fill: #fffdf9; } .ink { stroke: #2a2622; } .ac { stroke: #8a2b2b; fill: #8a2b2b; }
    @media (prefers-color-scheme: dark) { .bg { fill: #262320; } .ink { stroke: #ece6dc; } .ac { stroke: #e08a7a; fill: #e08a7a; } }
  </style>
  <rect class="bg" width="100" height="100" rx="22"/>
  <text class="ac" x="15" y="38" stroke="none" font-family="EB Garamond, Georgia, 'Times New Roman', serif" font-size="21">1</text>
  <g class="ink" stroke-width="5.5" stroke-linecap="round">
    <line x1="31" x2="82" y1="31" y2="31"/>
    <line x1="38" x2="80" y1="48" y2="48"/>
    <line x1="31" x2="78" y1="65" y2="65"/>
    <line x1="38" x2="66" y1="82" y2="82"/>
  </g>
  <g class="ac" stroke-width="4" stroke-linecap="round">
    <line x1="53" x2="53" y1="21" y2="35"/>
    <line x1="65" x2="65" y1="38" y2="52"/>
    <line x1="57" x2="57" y1="55" y2="69"/>
  </g>
</svg>
